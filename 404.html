    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #f6f3ee;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Everything that can be clicked zooms in a little under the mouse, so
         the web version feels alive. Only where there is a real mouse: on a
         phone a tap would leave it stuck zoomed. Greyed-out buttons stay put.
         The pieces on the outfit picture zoom from src/components/Collage.tsx. -->
    <style id="kapsel-hover">
      @media (hover: hover) and (pointer: fine) {
        [role="button"],
        [role="link"] {
          transition: transform 0.18s ease;
        }
        [role="button"]:not([aria-disabled="true"]):hover,
        [role="link"]:hover {
          transform: scale(1.04);
        }
        /* The pieces' cards in the capsule's list (src/app/capsule.tsx): the
           card lifts a little, its picture zooms. */
        [data-hover="card"],
        [data-hover="thumb"] {
          transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        [data-hover="card"]:hover {
          transform: scale(1.02);
          box-shadow: 0 6px 18px rgba(30, 27, 24, 0.1);
        }
        [data-hover="card"]:hover [data-hover="thumb"] {
          transform: scale(1.06);
        }
      }
    </style>
