    <!-- Hover, on computers only (a real mouse; on a phone a tap would leave
         it stuck). Small buttons zoom a little; the big buttons (data-cta)
         fill with a colour sweeping in; the header's links (data-navlink)

         soft shadow while their picture (data-zoom) slowly zooms. Greyed-out
         buttons stay put. -->
    <style id="kapsel-hover">

        [data-cta] {
          position: relative;
          overflow: hidden;
          isolation: isolate;
        }
        [data-cta]::before {
          content: '';
          position: absolute;
          inset: 0;
          z-index: -1;
          background: #3d3630;
          transform: scaleX(0);
          transform-origin: right;
          transition: transform 0.5s cubic-bezier(0.2, 0.6, 0.2, 1);
        }
        [data-cta='outline']::before,
        [data-cta='light']::before {
          background: #111111;
        }
        [data-cta]:hover::before {
          transform: none;
          transform-origin: left;
        }
        [data-cta='outline'] [dir='auto'],
        [data-cta='light'] [dir='auto'] {
          transition: color 0.3s ease;
        }
        [data-cta='outline']:hover [dir='auto'],
        [data-cta='light']:hover [dir='auto'] {
          color: #ffffff;
        }
        /* Their drawn icons turn white with the words. */
        [data-cta='outline'] svg path,
        [data-cta='light'] svg path {

        }
        [data-cta='outline']:hover svg path,
        [data-cta='light']:hover svg path {

        }
        [data-navlink]::after {
          content: '';
          position: absolute;
          left: 0;
          right: 0;
          bottom: 12px;
          height: 1px;
          background: currentColor;
          transform: scaleX(0);
          transform-origin: right;
          transition: transform 0.35s cubic-bezier(0.2, 0.6, 0.2, 1);
        }
        [data-navlink]:hover::after {

    <!-- Buttons that open something (data-fold, the owner, 13 Nov 2026): on a
         computer a line slides in along the bottom under the mouse, like the
         header's links. Opened (aria-expanded="true"), a line runs from the
         bottom left along the bottom, up the right side, across the top and
         down the left until the whole button is outlined; closed, the
         outline fades. "box" sits on the button's own border, and "tab"
         leaves out the bottom edge: it opens into a panel joined under it.
         "row" is a whole item of a list (a question and its answer, a
         category and its pieces), open when data-open="true", outlined a
         little outside it so what opened sits inside the same outline (the
         owner, 13 Nov 2026: "like they are two different things"). What
         opens (data-drop) unfolds from the top. -->
    <style id="kapsel-fold">
      [data-fold]::before {
        content: '';
        position: absolute;

        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      [data-fold='box']::before,
      [data-fold='tab']::before {
        inset: -1px;
      }
      [data-fold='tab']::before {
        border-bottom-color: transparent;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
      }

      [data-fold][data-open='true']::before {
        opacity: 1;
        transition: none;

        [data-fold][data-open='true']::before {
          animation: kapsel-trace 0.8s cubic-bezier(0.45, 0, 0.25, 1) both;
        }
        [data-drop] {
          animation: kapsel-drop 0.45s cubic-bezier(0.2, 0.6, 0.2, 1) both;
        }
      }
      @keyframes kapsel-trace {
        0% { clip-path: polygon(50% 50%, 0 100%, 0 100%, 0 100%, 0 100%, 0 100%); }
        25% { clip-path: polygon(50% 50%, 0 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%); }
        40% { clip-path: polygon(50% 50%, 0 100%, 100% 100%, 100% 0, 100% 0, 100% 0); }
        85% { clip-path: polygon(50% 50%, 0 100%, 100% 100%, 100% 0, 0 0, 0 0); }
        100% { clip-path: polygon(50% 50%, 0 100%, 100% 100%, 100% 0, 0 0, 0 100%); }
      }
      @keyframes kapsel-drop {
        from { opacity: 0.3; transform: translateY(-6px); clip-path: inset(-2px -40px 100% -40px); }
        to { opacity: 1; transform: none; clip-path: inset(-2px -40px -40px -40px); }
      }
      @media (hover: hover) and (pointer: fine) {
        [data-fold]::after {
          content: '';
          position: absolute;
          left: -12px;
          right: -12px;
          bottom: -1px;
          height: 1px;
          background: #111111;
          pointer-events: none;
          transform: scaleX(0);
          transform-origin: right;
          transition: transform 0.35s cubic-bezier(0.2, 0.6, 0.2, 1);
        }
        [data-fold='box']::after,
        [data-fold='tab']::after {
          left: -1px;
          right: -1px;
          bottom: -1px;
        }
        [data-fold]:hover::after {
          transform: none;
          transform-origin: left;
        }

    <!-- The mark on the chosen item of a group (data-snake, Slide.tsx; the
         owner, 13 Nov 2026) slides to a new choice like a snake: the edge in
         the direction of travel goes first, the other follows. The order of
         the delays is left, right, top, bottom. "still" places it at once (the

    <!-- Keyboard: whoever moves with Tab sees where they are (a blue ring,

    <!-- Motion, inspired by jaksten.dk: the front picture drifts slowly

          transform-origin: 60% 45%;
